name: Tests
on: [push, pull_request]
jobs:
  inference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - run: deep-patch-beltrami --help
      - run: python -m deep_patch_beltrami --help

  operator-research:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test]' './research[test]'
      - run: python -m pytest research/tests
      - run: python research/tools/evaluate_finalists.py self-test
      - run: python research/tools/summarize_sweep.py --self-test
      - run: python research/tools/test_summarize_lineage.py
      - run: python research/tools/build_public_report.py --help
      - run: python research/tools/evaluate_released.py --help
      - run: python research/tools/build_rollout_report.py --help
      - run: python research/tools/evaluate_rollout_released.py --help
      - run: python research/tools/export_rollout.py --help
      - run: python research/tools/report_rollout_validation.py --help
      - run: python research/tools/verify_rollout_export_cpu.py --help
      - run: beltrami-train --help
      - run: beltrami-precision-train --help
      - run: beltrami-rollout-train --help
      - run: beltrami-rollout-denoise --help
      - run: beltrami-operator-denoise --help

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ios/scripts/build_ios.sh --compile-only
