[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-patch-beltrami"
version = "1.3.0"
description = "Deep Patch-Beltrami inference and reproducible thesis denoising experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aaron Wetzler"}]
dependencies = ["numpy>=1.24", "Pillow>=9", "torch>=2.1", "h5py>=3.8"]

[project.urls]
Repository = "https://github.com/twerdster/deep-patch-beltrami"
Documentation = "https://github.com/twerdster/deep-patch-beltrami#readme"
Issues = "https://github.com/twerdster/deep-patch-beltrami/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
deep-patch-beltrami = "deep_patch_beltrami.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deep_patch_beltrami = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
