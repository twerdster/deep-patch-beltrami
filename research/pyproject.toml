[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beltrami-operator-research"
version = "0.2.0"
description = "Controlled training experiments for learned Beltrami differential operators"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Aaron Wetzler"}]
dependencies = ["deep-patch-beltrami>=1.1.0", "torch>=2.5", "numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]
datasets = ["opencv-python-headless>=4.10", "Pillow>=13"]
plots = ["matplotlib>=3.8"]

[project.scripts]
beltrami-train = "beltrami_operator.train:main"
beltrami-precision-train = "beltrami_precision.train:main"
beltrami-rollout-train = "beltrami_rollout.train:main"
beltrami-rollout-denoise = "beltrami_research.rollout_cli:main"
beltrami-operator-denoise = "beltrami_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
